name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            pack-script: desktop:pack:win
          - platform: macos
            runner: macos-latest
            pack-script: desktop:pack:mac
          - platform: linux
            runner: ubuntu-latest
            pack-script: desktop:pack:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js standalone server
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: https://my-desktop.invalid

      - name: Package desktop application
        run: bun run ${{ matrix.pack-script }}

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/**/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
          draft: true
